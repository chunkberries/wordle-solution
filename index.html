<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's Wordle Solution</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #121213;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      padding: 40px;
      border-radius: 12px;
      background: #1a1a1b;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    .date {
      font-size: 1.2rem;
      color: #b3b3b3;
      margin-bottom: 10px;
    }

    .solution {
      font-size: 5rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      margin-top: 10px;
    }

    .error {
      color: #ff6b6b;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="date" id="date">Loading…</div>
    <div class="solution" id="solution">⬜⬜⬜⬜⬜</div>
  </div>

  <script>
    const today = new Date().toISOString().split("T")[0];
console.log(today);
const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(`https://www.nytimes.com/svc/wordle/v2/${today}.json`);
const apiKey = 'ea9f766f'; // idfc abt this so here it is

fetch(proxyUrl, {
  headers: {
    'Authorization': `Bearer ${apiKey}`
  }
})
.then(response => {
  if (!response.ok) {
    throw new Error("Failed to fetch Wordle data");
  }
  return response.json();
})
.then(data => {
  document.getElementById("solution").textContent = data.solution.toUpperCase();
})
.catch(err => {
  document.getElementById("solution").innerHTML =
    `<div class="error">Unable to load solution</div>`;
  console.error(err);
});
  </script>
</body>
</html>
